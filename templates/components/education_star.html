{% if user.is_authenticated %}
    <form method="post" action="{% url 'main:toggle_star_education' education.id %}" class="star-form">
        {% csrf_token %}
        {% if user in education.starred_by.all %}
            <button type="submit" class="button button-star is-starred">
                ★ Unstar <span class="star-count">{{ education.starred_by.count }}</span>
            </button>
            <span>Kamu sudah memberi star</span>
        {% else %}
            <button type="submit" class="button button-star">
                ★ Star <span class="star-count">{{ education.starred_by.count }}</span>
            </button>
            <span>Kamu belum memberi star</span>
        {% endif %}
    </form>
{% else %}
    <a href="{% url 'main:login' %}" class="button button-star">
        ★ Login untuk Star <span class="star-count">{{ education.starred_by.count }}</span>
    </a>
{% endif %}
