<p class="item-actions">
    <a href="{% url 'main:edit_education' education.id %}"
        class="button button-secondary"
        aria-label="Edit {{ education.institution_name }}">Edit</a>
    <button type="button"
            class="button button-danger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Hapus {{ education.institution_name }}"
            title="Hapus riwayat pendidikan">
        Hapus
    </button>
</p>
<div id="delete-education-{{ education.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ education.id }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-education-title-{{ education.id }}">Hapus Riwayat Pendidikan?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ education.institution_name }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-{{ education.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
