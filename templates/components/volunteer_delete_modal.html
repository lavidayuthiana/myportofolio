<p class="item-actions">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-volunteer-{{ volunteer.id }}"
            aria-label="Hapus {{ volunteer.organization_name }}"
            title="Hapus kegiatan volunteer">
        Hapus
    </button>
</p>
<div id="delete-volunteer-{{ volunteer.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-volunteer-title-{{ volunteer.id }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-volunteer-{{ volunteer.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-volunteer-{{ volunteer.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-volunteer-title-{{ volunteer.id }}">Hapus Kegiatan Volunteer?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ volunteer.organization_name }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-volunteer-{{ volunteer.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_volunteer' volunteer.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
