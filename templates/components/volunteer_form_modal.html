<div id="add-volunteer-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-volunteer-modal-title">
    <button type="button"
            class="experience-form-modal__backdrop"
            popovertarget="add-volunteer-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah volunteer"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                popovertarget="add-volunteer-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah volunteer">&times;</button>

        <h2 id="add-volunteer-modal-title">Tambah Kegiatan Volunteer</h2>
        <form id="volunteer-form"
              method="post"
              action="{% url 'main:create_volunteer' %}"
              class="data-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-volunteer-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Volunteer</button>
            </div>
        </form>
    </div>
</div>
