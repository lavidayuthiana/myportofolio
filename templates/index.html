{% extends "base.html" %}
{% block meta %}
    <title>{{ name }} - Portfolio</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Sistem Informasi &middot; Universitas Indonesia</p>
                    <h1>{{ name}}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/FotoLvd.JPG" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Sesi Terakhir Login</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/lavidayuthiana" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/lavida-yuthiana-faizah-61405a31a" class="social-link">LinkedIn</a>
                        <a href="mailto:lavida.yuthiana@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
